name: Build ParaphraseIt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: ParaphraseIt-Windows
            ext: .exe
          - os: ubuntu-latest
            artifact: ParaphraseIt-Linux
            ext: ""
          - os: macos-latest
            artifact: ParaphraseIt-Mac
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name "ParaphraseIt" --icon "assets/icon.ico" --add-data "assets;assets" --add-data ".env;." paraphrase.py

      - name: Build executable (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --windowed --name "ParaphraseIt" --add-data "assets:assets" --add-data ".env:." paraphrase.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/ParaphraseIt${{ matrix.ext }}
